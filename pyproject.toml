[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sql-sage"
description = "Parse, check, translate and review SQL for PostgreSQL, SQLite and Oracle with one shared AST"
requires-python = ">=3.8"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ville Vainio", email = "vivainio@gmail.com" }]
keywords = ["sql", "parser", "oracle", "postgres", "sqlite", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Software Development :: Compilers",
    "Topic :: Utilities",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/vivainio/sql-sage"
Repository = "https://github.com/vivainio/sql-sage"

[tool.maturin]
# ship the `sql-sage` command as a wheel (no Python API)
bindings = "bin"
